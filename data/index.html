<!DOCTYPE html>
<html>
<head>
    <meta charset='UTF-8'>
    <title>GyverLamp Web</title>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #222;
            color: #eee;
            font-size: 1.1em;
        }
        h1 {
            color: #00bcd4;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #45a049;
        }
        .slider-container {
            margin: 20px 0;
        }
        input[type='range'] {
            -webkit-appearance: none;
            appearance: none;
            width: 80%;
            max-width: 400px;
            height: 10px;
            background: #d3d3d3;
            outline: none;
            opacity: 0.7;
            transition: opacity .2s;
            border-radius: 5px;
        }
        input[type='range']::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #00bcd4;
            cursor: pointer;
        }
        input[type='range']::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #00bcd4;
            cursor: pointer;
        }
        .section {
            background-color: #333;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
            max-width: 500px;
        }
    </style>
</head>
<body>
    <h1>GyverLamp Web Control</h1>

    <div class="section">
        <p>Brightness: <span id='brightnessValue'>64</span></p>
        <div class='slider-container'>
            <input type='range' id='brightnessSlider' min='0' max='255' value='64' oninput='updateBrightnessValue(this.value)' onchange='setBrightness(this.value)'>
        </div>
        <p>Speed: <span id='speedValue'>50</span></p>
        <div class='slider-container'>
            <input type='range' id='speedSlider' min='0' max='100' value='50' oninput='updateSpeedValue(this.value)' onchange='setSpeed(this.value)'>
        </div>
    </div>

    <div class="section">
        <p>Current Mode: <span id='modeValue'>0</span></p>
        <button onclick='changeMode(0)'>Mode 0 (Solid Color)</button>
        <button onclick='changeMode(1)'>Mode 1 (Rainbow Chase)</button>
        <button onclick='changeMode(2)'>Mode 2 (Fire)</button> </div>

    <script>
        // Функция для отправки запросов на ESP
        function sendRequest(url) {
            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        console.error('Network response was not ok ' + response.statusText);
                    }
                })
                .catch(error => console.error('Fetch error:', error));
        }

        function updateBrightnessValue(value) {
            document.getElementById('brightnessValue').innerText = value;
        }
        function setBrightness(value) {
            sendRequest('/brightness?value=' + value);
        }

        function updateSpeedValue(value) {
            document.getElementById('speedValue').innerText = value;
        }
        function setSpeed(value) {
            sendRequest('/speed?value=' + value);
        }

        function changeMode(mode) {
            document.getElementById('modeValue').innerText = mode;
            sendRequest('/mode?value=' + mode);
        }

        // Инициализация значений ползунков при загрузке страницы
        // В идеале, эти значения должны запрашиваться с сервера при загрузке страницы
        // Но для простоты пока оставим жестко заданными в HTML
        document.addEventListener('DOMContentLoaded', () => {
            updateBrightnessValue(document.getElementById('brightnessSlider').value);
            updateSpeedValue(document.getElementById('speedSlider').value);
        });
    </script>
</body>
</html>
